[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "custodian-codex-guard"
version = "0.2.0"
description = "Policy guard for Codex CLI: evaluate coding-agent actions before execution (thin adapter on custodian-kernel)"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "InovinLabs"}]
keywords = ["codex", "guard", "policy", "agent", "enforcement"]
dependencies = [
    "custodian-kernel>=0.5,<0.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://getcustodian.xyz"
Repository = "https://github.com/KeyArgo/custodian-codex-guard"
Documentation = "https://getcustodian.xyz/docs"

[project.scripts]
custodian-codex = "custodian.guards.codex.cli:main"
custodian-codex-guard-hook = "custodian.guards.codex.hook:main"
custodian-codex-guard-mcp = "custodian.guards.codex.mcp_server:main"

[tool.setuptools]
packages = [
    "custodian",
    "custodian.codex_guard",
    "custodian.guards",
    "custodian.guards.codex",
]
