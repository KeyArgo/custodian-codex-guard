[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "custodian-codex-guard"
version = "0.2.0"
description = "Policy guard for Codex CLI: evaluate coding-agent actions before execution (thin adapter on custodian-kernel)"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "InovinLabs"}]
keywords = ["codex", "guard", "policy", "agent", "enforcement"]
dependencies = [
    "custodian-kernel>=0.5,<0.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://getcustodian.xyz"
Repository = "https://github.com/KeyArgo/custodian-codex-guard"
Documentation = "https://getcustodian.xyz/docs"

[project.scripts]
custodian-codex = "custodian.guards.codex.cli:main"
custodian-codex-guard-hook = "custodian.guards.codex.hook:main"
custodian-codex-guard-mcp = "custodian.guards.codex.mcp_server:main"

[tool.setuptools]
packages = [
    "custodian",
    "custodian.codex_guard",
    "custodian.guards",
    "custodian.guards.codex",
    "custodian.guards.codex.bundled_plugin",
    "custodian.guards.codex.bundled_plugin.plugins",
]

[tool.setuptools.package-data]
# Explicit dot-segment patterns, not "bundled_plugin/**/*": Python's glob
# (which setuptools' package-data resolution uses internally) never matches
# a leading-dot path component via * or ** -- even with recursive=True --
# so a wildcard-only pattern here silently drops .agents/, .codex-plugin/,
# and .mcp.json from the wheel while still matching the plain-named files,
# which is exactly what happened in the 2026-08-16 broken 0.2.0 release
# (only README.md and SKILL.md made it into the wheel; the Codex CLI's
# marketplace.json and plugin.json never did).
"custodian.guards.codex" = [
    "bundled_plugin/.agents/*",
    "bundled_plugin/.agents/**/*",
    "bundled_plugin/plugins/**/*",
    "bundled_plugin/plugins/**/.*",
    "bundled_plugin/plugins/*/.codex-plugin/*",
    "bundled_plugin/plugins/*/.mcp.json",
]
